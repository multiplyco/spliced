<script>
  /* Theme before first paint: "dark" (default, the Spliced brand), "light" or "system", saved in localStorage. */
  (() => {
    const m = localStorage.getItem("cr.theme") || "dark";
    const dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.classList.toggle("dark", dark);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.classList.toggle("sb-off", localStorage.getItem("cr.sidebar") === "0");
    document.documentElement.classList.toggle("cards-always", localStorage.getItem("cr.cardDetails") === "always");
    document.documentElement.classList.toggle("no-grain", localStorage.getItem("cr.grain") === "0");
  })();
</script>
